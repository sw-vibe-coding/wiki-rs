<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wiki-RS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        nav { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        a { color: #0645ad; text-decoration: none; }
        a:hover { text-decoration: underline; }
        a.wiki-link-missing { color: #d33; }
        textarea { width: 100%; height: 300px; font-family: monospace; font-size: 14px; padding: 8px; }
        button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
        .page-title { border-bottom: 1px solid #aaa; }
        .page-list a { display: block; padding: 4px 0; }
        .edit-hint { color: #666; font-size: 0.9em; margin-bottom: 8px; }
    </style>
</head>
<body></body>
</html>
