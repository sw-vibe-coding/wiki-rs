[package]
name = "wiki-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
wiki-common = { path = "../wiki-common" }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement", "HtmlElement", "Element", "DomTokenList", "Event", "MouseEvent"] }
wasm-bindgen = "0.2"
gloo = "0.11"
log = "0.4"
