[package]
name = "wiki-export-file"
version = "0.1.0"
edition = "2024"

[dependencies]
wiki-common = { path = "../../shared/wiki-common" }
wiki-ui = { path = "../../ui/wiki-ui" }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement",
    "HtmlInputElement", "File", "FileList", "FileReader",
    "Document", "Event", "MouseEvent",
] }
wasm-logger = "0.2"
js-sys = "0.3"
gloo = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
