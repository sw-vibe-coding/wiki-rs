[package]
name = "wiki-server"
version = "0.1.0"
edition = "2024"

[dependencies]
wiki-common = { path = "../../shared/wiki-common", features = ["server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
wiki-server-db = { path = "../wiki-server-db" }
